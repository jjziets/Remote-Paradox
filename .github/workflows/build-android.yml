name: Build & Sign Android APKs

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build signed APKs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > release-keystore.jks

      - name: Create keystore.properties
        run: |
          cat > keystore.properties <<EOF
          storeFile=release-keystore.jks
          storePassword=${{ secrets.KEYSTORE_STORE_PASSWORD }}
          keyAlias=${{ secrets.KEYSTORE_KEY_ALIAS }}
          keyPassword=${{ secrets.KEYSTORE_KEY_PASSWORD }}
          EOF

      - name: Inject google-services.json (if configured)
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json
            cp app/google-services.json watch-app/google-services.json
            echo "google-services.json injected into app/ and watch-app/"
          else
            echo "GOOGLE_SERVICES_JSON_BASE64 secret not set — skipping (Firebase/FCM inactive in this build)"
          fi

      - name: Detect watch app changes
        id: changes
        working-directory: .
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            base_ref="$(git tag --sort=-v:refname | grep -v "^${GITHUB_REF_NAME}$" | head -n1 || true)"
          else
            base_ref="${{ github.event.before }}"
            if [[ -z "$base_ref" || "$base_ref" =~ ^0+$ ]]; then
              base_ref="HEAD^"
            fi
          fi

          if [[ -z "$base_ref" ]]; then
            echo "watch_changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$base_ref" "$GITHUB_SHA" | grep -qE '^android-app/(watch-app|diagnostics)/|^android-app/(build.gradle.kts|settings.gradle.kts|gradle.properties)|^android-app/gradle/'; then
            echo "watch_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "watch_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build phone app (release)
        # Unit tests run before either signed APK can be published.
        run: ./gradlew :diagnostics:testDebugUnitTest :app:testDebugUnitTest :watch-app:testDebugUnitTest :app:assembleRelease

      - name: Build watch app (release)
        run: ./gradlew :watch-app:assembleRelease

      - name: Rename APKs (version in filename so phone/watch update independently)
        run: |
          # Always attach BOTH APKs to every release so the latest release always
          # carries the current phone AND watch builds — the in-app updater reads
          # each app's version from its own filename, so a release missing one
          # APK would make that app's updates unreachable.
          PHONE_VER=$(grep -E 'versionName *= *"' app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          cp app/build/outputs/apk/release/*.apk "remote-paradox-phone-${PHONE_VER}.apk"
          WATCH_VER=$(grep -E 'versionName *= *"' watch-app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          cp watch-app/build/outputs/apk/release/*.apk "remote-paradox-watch-${WATCH_VER}.apk"

      - name: Upload phone APK
        uses: actions/upload-artifact@v4
        with:
          name: phone-app-release
          path: android-app/remote-paradox-phone-*.apk
          if-no-files-found: error

      - name: Upload watch APK
        uses: actions/upload-artifact@v4
        with:
          name: watch-app-release
          path: android-app/remote-paradox-watch-*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          assets=()
          for f in remote-paradox-phone-*.apk remote-paradox-watch-*.apk; do
            [[ -f "$f" ]] && assets+=("$f")
          done
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            "${assets[@]}"
        working-directory: android-app

      - name: Clean up keystore
        if: always()
        run: rm -f release-keystore.jks keystore.properties
